<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bedeguar — AR test</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#111;color:#ddd;font:15px/1.4 system-ui,sans-serif}
  model-viewer{width:100%;height:100%;--poster-color:#111}
  .note{position:fixed;left:12px;bottom:12px;right:12px;font-size:13px;opacity:.75}
  button[slot="ar-button"]{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);padding:12px 20px;border:0;border-radius:24px;background:#e8e2d4;color:#111;font-weight:600}
</style>
</head>
<body>
<model-viewer
  src="gall_mobile.glb"
  ios-src="gall_mobile.usdz"
  alt="Bedeguar gall, growing"
  ar ar-modes="webxr scene-viewer quick-look"
  ar-scale="auto"
  ar-placement="floor"
  autoplay
  camera-controls
  shadow-intensity="0.6"
  exposure="1.0">
  <button slot="ar-button">View in your space</button>
</model-viewer>
<div class="note">Test page. Android: WebXR or Scene Viewer via the GLB. iPhone: Quick Look via the USDZ. Swap <code>_mobile</code> for <code>_full</code> to test the undecimated files.</div>
</body>
</html>
