<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bedeguar</title>
<meta name="description" content="Bedeguar — an augmented-reality gall. Tap to place it in your space.">
<style>
  :root{--bg:#0e0f0c;--fg:#e9e4d6;--dim:#8d8a7e;--accent:#b8b08a}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:17px/1.45 -apple-system,system-ui,"Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%}
  a{color:inherit;text-decoration:none}
  [hidden]{display:none!important}
  /* The AR link lives off-screen with a 1-pixel image (Safari draws its cube badge on the link's image; this way it is never seen).
     The visible picture, words and ring all fire that link. */
  .arlink{position:absolute;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;opacity:0}
  /* The AR link may contain ONE element only, the image (Safari rule). */
  .tap{position:fixed;left:0;right:0;top:0;height:62%;display:block;cursor:pointer;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  .tap img{width:100%;height:100%;object-fit:contain;object-position:50% 60%;padding:10vh 10vw 0;box-sizing:border-box;opacity:.95;display:block}
  .words{position:fixed;left:0;right:0;top:64%;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  h1{font-weight:400;letter-spacing:.42em;text-transform:uppercase;font-size:15px;margin:0;color:var(--dim)}
  .cta{font-size:22px;margin:0}
  .sub{font-size:13px;color:var(--dim);margin:0;max-width:30ch}
  .ring{width:72px;height:72px;border:1px solid var(--accent);border-radius:50%;display:grid;place-items:center;margin-top:6px;cursor:pointer}
  .ring span{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.9);opacity:1}}
  .status{font-size:13px;color:var(--dim);margin:0;min-height:1.4em}
  .desk{display:none;position:fixed;inset:0}
  model-viewer{width:100%;height:100%;--poster-color:var(--bg)}
  .note{position:fixed;left:16px;right:16px;bottom:16px;font-size:13px;color:var(--dim);text-align:center}
</style>
</head>
<body>

<!-- The AR links, off-screen. iPhone: Safari opens a rel="ar" link straight into AR Quick Look (only the USDZ is downloaded).
     Android: a Scene Viewer intent; Chrome hands the GLB to Google's AR viewer. -->
<a id="ios" class="arlink" rel="ar" href="gall_v0_8_mobile.usdz" hidden><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt=""></a>
<a id="android" class="arlink" hidden><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt=""></a>

<!-- What the visitor sees -->
<div id="pic" class="tap" hidden><img src="bud.png" alt="Bedeguar"></div>
<div id="words" class="words" hidden>
  <h1>Bedeguar</h1>
  <p class="cta">Tap to grow the gall</p>
  <p class="sub">Point your phone at the floor and let it find the ground. It takes a minute to grow.</p>
  <div class="ring" id="ring"><span></span></div>
  <p class="status" id="status"></p>
</div>

<!-- Anything else (a laptop): a plain 3D preview. -->
<div id="desk" class="desk">
  <model-viewer src="gall_v0_8_mobile.glb" alt="Bedeguar gall, growing" autoplay camera-controls
    camera-orbit="30deg 75deg 3.2m" camera-target="0m 0.65m 0m" min-camera-orbit="auto auto 1.6m" max-camera-orbit="auto auto 6m"
    shadow-intensity="0.6" exposure="1.0" interaction-prompt="none"></model-viewer>
  <div class="note">Bedeguar — scan the code on the screen with your phone to place the gall in your space.</div>
</div>

<script>
(function(){
  var ua=navigator.userAgent||"";
  var ios=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  var android=/Android/.test(ua);
  var pic=document.getElementById("pic"), words=document.getElementById("words"), status=document.getElementById("status");
  function show(link){
    link.hidden=false; pic.hidden=false; words.hidden=false;
    function go(){ status.textContent="Loading the gall\u2026 a few seconds"; link.click(); }
    pic.addEventListener("click",go); words.addEventListener("click",go);
  }
  if(ios){
    show(document.getElementById("ios"));
  }else if(android){
    var b=document.getElementById("android");
    var glb=location.origin+location.pathname.replace(/[^\/]*$/,"")+"gall_v0_8_mobile.glb";
    b.href="intent://arvr.google.com/scene-viewer/1.0?file="+encodeURIComponent(glb)+"&mode=ar_preferred&title=Bedeguar"
          +"#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;"
          +"S.browser_fallback_url="+encodeURIComponent(location.href)+";end;";
    show(b);
  }else{
    var d=document.getElementById("desk"); d.style.display="block";
    var s=document.createElement("script"); s.type="module";
    s.src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js";
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
